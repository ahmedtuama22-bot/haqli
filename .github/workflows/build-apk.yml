name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o Haqli-android.zip -d app-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: app-src
        run: gradle assembleRelease --no-daemon
      - name: Rename
        run: cp app-src/app/build/outputs/apk/release/app-release.apk Haqli.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Haqli-apk
          path: Haqli.apk
